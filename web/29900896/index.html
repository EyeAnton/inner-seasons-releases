<!doctype html>
<html lang="ru" data-theme="soft" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Внутренние сезоны</title>
<style>
@font-face{font-family:'Open Sans';src:local('Open Sans'),local('OpenSans-Regular')}
:root{
  --font:'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-card:18px;--r-btn:24px;
}
/* ---------- темы: нежная / яркая × светлая / тёмная ---------- */
[data-theme=soft][data-mode=light]{--bg:#FBF7F5;--card:#FFFFFF;--field:#F6F0EE;--text:#2E2A2C;--text2:#6F6668;--line:#EFE6E3;--nav:#FFFFFF;--accent:#A8475E;
  --btn:#F2C4CE;--btnText:#4A1F2A;--btnSoft:#FBE9ED;--ok:#9DC29C;--banner:#E1ECF4;--bannerText:#1F4560;--warn:#FFF1D6;--warnText:#5C3D00;
  --orb:rgba(255,255,255,.35);--segBg:rgba(46,42,44,.08);--segOn:#FFFFFF;--segOnText:#2E2A2C;--track:rgba(46,42,44,.14);--scrim:rgba(46,42,44,.35);--mine:#FBE9ED;
  --w:#EBCFD5;--s:#D3E6D2;--u:#F5E3B5;--a:#F3D3C2;--wT:#2E2A2C;--sT:#2E2A2C;--uT:#2E2A2C;--aT:#2E2A2C;--wA:#9B4A5A;--sA:#4F7F55;--uA:#8C6A1F;--aA:#A55A3C}
[data-theme=soft][data-mode=dark]{--bg:#17141A;--card:#221E25;--field:#2B262E;--text:#F2ECEE;--text2:#B3A9AE;--line:#352F38;--nav:#1C181F;--accent:#F0B6C4;
  --btn:#E8B4C1;--btnText:#2A1A1F;--btnSoft:#3A2730;--ok:#7FA77E;--banner:#1E2B36;--bannerText:#CFE3F2;--warn:#3A3020;--warnText:#F3DDAE;
  --orb:rgba(255,255,255,.05);--segBg:rgba(255,255,255,.10);--segOn:#F2ECEE;--segOnText:#17141A;--track:rgba(255,255,255,.16);--scrim:rgba(0,0,0,.55);--mine:#3A2730;
  --w:#4A2C35;--s:#2E4032;--u:#4B4027;--a:#4C3228;--wT:#F2ECEE;--sT:#F2ECEE;--uT:#F2ECEE;--aT:#F2ECEE;--wA:#E7AAB7;--sA:#ACD3AB;--uA:#EDCE8A;--aA:#EDB496}
[data-theme=bright][data-mode=light]{--bg:#F5F5F5;--card:#FFFFFF;--field:#F5F5F5;--text:#222222;--text2:#6B6B6B;--line:#E5E5E5;--nav:#FFFFFF;--accent:#C24D6A;
  --btn:#C24D6A;--btnText:#FFFFFF;--btnSoft:#FBE3E9;--ok:#009F83;--banner:#0F8FBA;--bannerText:#FFFFFF;--warn:#FFF1D6;--warnText:#5C3D00;
  --orb:rgba(255,255,255,.10);--segBg:rgba(0,0,0,.18);--segOn:#FFFFFF;--segOnText:#222222;--track:rgba(255,255,255,.35);--scrim:rgba(0,0,0,.5);--mine:#FBE3E9;
  --w:#7B2D3B;--s:#3F7A4C;--u:#E0A33A;--a:#B0532F;--wT:#FFFFFF;--sT:#FFFFFF;--uT:#222222;--aT:#FFFFFF;--wA:#7B2D3B;--sA:#3F7A4C;--uA:#8C6A1F;--aA:#B0532F}
[data-theme=bright][data-mode=dark]{--bg:#121212;--card:#1E1E1E;--field:#262626;--text:#F5F5F5;--text2:#A8A8A8;--line:#2E2E2E;--nav:#181818;--accent:#F08AA3;
  --btn:#E07A93;--btnText:#1A0E12;--btnSoft:#3A1E26;--ok:#2BB89C;--banner:#0E5F76;--bannerText:#FFFFFF;--warn:#3A3020;--warnText:#F3DDAE;
  --orb:rgba(255,255,255,.08);--segBg:rgba(0,0,0,.25);--segOn:#FFFFFF;--segOnText:#222222;--track:rgba(255,255,255,.30);--scrim:rgba(0,0,0,.6);--mine:#3A1E26;
  --w:#7B2D3B;--s:#3F7A4C;--u:#E0A33A;--a:#B0532F;--wT:#FFFFFF;--sT:#FFFFFF;--uT:#222222;--aT:#FFFFFF;--wA:#E7AAB7;--sA:#ACD3AB;--uA:#EDCE8A;--aA:#EDB496}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--font);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;min-height:100vh}
textarea,input{-webkit-user-select:text;user-select:text;font:16px/24px var(--font);color:var(--text)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:active,a:active,.tap:active{opacity:.7}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
.muted{color:var(--text2)}
.small{font-size:13px;line-height:18px}
.cap{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}
.screen{min-height:100vh;display:flex;flex-direction:column}
.pad{padding:16px}

/* кнопки */
.btn{height:48px;border:0;border-radius:var(--r-btn);background:var(--btn);color:var(--btnText);font-weight:700;font-size:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px}
.btn[disabled]{opacity:.45}
.btn.ghost{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--text)}
.btn.link{background:none;color:var(--accent);height:44px}
.btn.okb{background:var(--s);color:var(--sT)}
.icon-btn{width:44px;height:44px;border:0;border-radius:22px;background:var(--field);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* карточки */
.card{background:var(--card);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.ico{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--btnSoft);color:var(--accent)}
.banner{display:flex;align-items:center;gap:10px;min-height:44px;padding:10px 14px;border-radius:12px;background:var(--banner);color:var(--bannerText);font-size:14px;line-height:20px;font-weight:700}
.warnbox{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--warn);color:var(--warnText);font-size:14px;line-height:20px}

/* шапка и герой */
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;gap:12px}
.bar h1{font-size:24px;line-height:32px;font-weight:800}
.seg{display:flex;background:var(--segBg);border-radius:20px;padding:3px}
.seg button{height:32px;padding:0 6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;border-radius:16px;background:none;font-size:13px;line-height:18px}
.seg button.on{background:var(--segOn);color:var(--segOnText);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.hero{position:relative;overflow:hidden;padding:4px 16px 18px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:16px;background:var(--hero);color:var(--heroT)}
.hero .bar{padding:12px 0 0}
.hero .orb{position:absolute;border-radius:50%;background:var(--orb);pointer-events:none}
.hero .day{font-size:12px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hero .name{font-size:clamp(24px,8.4vw,36px);line-height:1.1;font-weight:800;white-space:nowrap;letter-spacing:-.01em}
.hero .sub{font-size:15px;line-height:20px;opacity:.85}
.cbar{display:flex;gap:4px;height:8px}.cbar span{flex:1}.clab span{flex:1}.clab span:last-child{text-align:right}
.cbar span{border-radius:4px;background:var(--track);position:relative}
.cbar span.on{background:var(--heroT)}
.cbar i{position:absolute;top:-5px;width:18px;height:18px;margin-left:-9px;border-radius:9px;background:var(--heroT);box-shadow:0 0 0 4px var(--segBg)}
.clab{display:flex;font-size:11px;line-height:14px;font-weight:700;opacity:.8}
.content{flex:1;padding:14px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}

/* чипсы */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chip{height:36px;padding:0 14px;border:0;border-radius:18px;background:none;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;flex:none;color:var(--text)}
.chip.on{background:var(--btn);color:var(--btnText);box-shadow:none;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border-radius:13px;box-shadow:inset 0 0 0 1px var(--line);font-size:12px;font-weight:700}
.badge b{width:10px;height:10px;border-radius:3px}

/* нижняя навигация */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--nav);box-shadow:0 -1px 0 var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:none;color:var(--text2);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;min-height:52px;justify-content:center}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs button{position:relative}
.tabs .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--btn);color:var(--btnText);font-size:10px;line-height:16px;font-weight:700;padding:0 4px}

/* календарь */
.cal-head{display:flex;justify-content:space-between;align-items:center}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{font-size:11px;line-height:16px;color:var(--text2);text-align:center}
.dcell{aspect-ratio:1;border:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0;background:var(--f);color:var(--fT)}
.dcell b{font-size:15px;line-height:18px}
.dcell small{font-size:9px;line-height:12px;opacity:.85}
.dcell.future{background:none;color:var(--text2);box-shadow:inset 0 0 0 1.5px var(--f)}
.dcell.now{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--text)}
.dcell.sel{outline:2px solid var(--text);outline-offset:-2px}
.dcell .gate{position:absolute;top:4px;right:5px;width:6px;height:6px;transform:rotate(45deg);background:currentColor}
.dcell .nd{position:absolute;bottom:4px;width:4px;height:4px;border-radius:2px;background:currentColor}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend b{width:10px;height:10px;border-radius:3px}

/* лента записей */
.feed{display:flex;flex-direction:column;gap:10px}
.when{align-self:center;font-size:12px;font-weight:700;color:var(--text2);padding-top:6px}
.bub{max-width:82%;padding:10px 14px;font-size:15px;line-height:20px;border-radius:20px;white-space:pre-wrap;word-wrap:break-word}
.bub small{display:block;font-size:12px;line-height:16px;color:var(--text2);margin-top:4px}
.bub.in{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bub.out{align-self:flex-end;background:var(--mine);border-bottom-right-radius:6px}
.bub.lock{align-self:flex-start;background:var(--field);color:var(--text2);font-size:14px;display:flex;gap:8px;align-items:center;border-bottom-left-radius:6px}

/* шторка */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;max-height:88vh;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;box-sizing:border-box;background:var(--card);border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;position:relative;animation:up .24s ease-out}
.sheet .grab{align-self:stretch;display:flex;justify-content:center;padding:4px 0 10px;margin:-10px -16px -10px;touch-action:none}.sheet .handle{width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheet .x{position:absolute;right:8px;top:8px;background:none}
.sheet .ttl{text-align:center;display:flex;flex-direction:column;gap:2px;padding:4px 40px 0}
.sheet .ttl b{font-size:18px;line-height:26px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.ico.sm{width:32px;height:32px;border-radius:16px}.ico.sm .i{width:18px;height:18px}
html.lock,html.lock body{overflow:hidden;height:100%}
.chip.t{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--gA) 55%,transparent)}
.chip.t.on{background:var(--g);color:var(--gT);box-shadow:inset 0 0 0 2px var(--gA);font-weight:700}
.tgroup{display:flex;flex-direction:column;gap:6px}
.feel{display:flex;flex-direction:column;gap:10px}
.fpills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fpill{height:52px;border:0;border-radius:14px;background:var(--f);color:var(--fT);font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:16px;opacity:.75}
.fpill small{font-size:10px;font-weight:400;opacity:.85}
.fpill.on{opacity:1;box-shadow:inset 0 0 0 2.5px var(--fA)}
.btn.soft{background:var(--btnSoft);color:var(--text)}
.dcell.guess{opacity:.5}
.toppop{position:fixed;top:12px;left:12px;right:12px;z-index:25;background:var(--card);color:var(--text);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.28);padding:14px;display:flex;flex-direction:column;gap:12px;animation:down .25s ease-out}
@keyframes down{from{transform:translateY(-120%)}to{transform:none}}
.hbar{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hbar h1{font-size:24px;line-height:32px;font-weight:800}
.hlink{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:10px 14px;border:0;border-radius:14px;background:var(--segBg);color:inherit;font:inherit;font-size:15px;line-height:20px;font-weight:700;text-align:left}
.hlink span{flex:1}.hl2{display:flex;flex-direction:column;gap:2px}.hl2 small{font-size:13px;line-height:18px;font-weight:400;opacity:.8}.hlink .i{flex:none}
h1,h2,b,.name,.ttl b{text-wrap:balance}
p,.sub,.small{text-wrap:pretty}
@keyframes fade{from{opacity:0}to{opacity:1}}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mood{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;padding:0;color:var(--text)}
.mood span{width:56px;height:56px;border-radius:28px;background:var(--field);display:flex;align-items:center;justify-content:center}
.mood.on span{background:var(--s);color:var(--sT);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--sA)}
.mood.on{font-weight:700}
textarea.f{width:100%;border:0;border-radius:14px;background:var(--field);padding:12px 14px;resize:none;outline:none}
input.f{width:100%;height:48px;border:0;border-radius:14px;background:var(--field);padding:0 14px;outline:none}

/* переключатели и строки настроек */
.sw{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;border:0;padding:0}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--ok)}
.sw.on::after{left:23px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-top:1px solid var(--line);padding:6px 0}
.srow:first-of-type{border-top:0}
.srow .t{display:flex;flex-direction:column}
.srow .t span{font-size:13px;line-height:18px;color:var(--text2)}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tcard{height:64px;border:0;border-radius:14px;background:var(--field);display:flex;align-items:center;gap:10px;padding:0 12px;font-size:14px;color:var(--text)}
.tcard.on{box-shadow:inset 0 0 0 2px var(--accent);font-weight:700}
.tcard .q{display:grid;grid-template-columns:repeat(2,12px);gap:3px}
.tcard .q i{width:12px;height:12px;border-radius:6px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper b{min-width:28px;text-align:center}
.av{width:48px;height:48px;border-radius:24px;background:var(--btn);color:var(--btnText);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}

/* вход */
.login{min-height:100vh;background:#17141A;color:#F2ECEE;display:flex;flex-direction:column;padding:48px 24px calc(72px + env(safe-area-inset-bottom));gap:20px;position:relative;overflow:hidden}
.login .glow{position:absolute;left:-120px;top:20px;width:630px;height:630px;border-radius:50%;background:radial-gradient(circle,rgba(232,180,193,.18) 0%,rgba(23,20,26,0) 65%)}
.login .btn{background:#E8B4C1;color:#2A1A1F}
.login .btn.gbtn{background:#FFFFFF;color:#2A1A1F}
.login .consent{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:20px;color:#D9D0D3;text-align:left;border:0;background:none;padding:4px 0}
.login .box{width:24px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 2px #8E8588;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
.login .box.on{background:#E8B4C1;box-shadow:none;color:#2A1A1F}
.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:30;background:var(--text);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:14px;animation:fade .2s}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;margin:40vh auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div id="layer"></div>

<script src="config.js"></script>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
